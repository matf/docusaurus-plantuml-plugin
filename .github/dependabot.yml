version: 2

updates:
  # One pull request for every npm update in the repository. The plugin and the example site it
  # is tested against share a single PR, so their lockfiles can never disagree about a shared
  # dependency, and there is never a second open PR whose lockfile goes stale behind the first.
  #
  # `open-pull-requests-limit: 1` is the load-bearing part: releases are cut automatically from
  # every green `main`, and two dependency PRs racing into `main` is exactly what that automation
  # must never have to reason about.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/examples/docusaurus'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
    groups:
      # No `update-types` filter, deliberately: majors join the group instead of spawning a second
      # PR. `.github/workflows/dependabot-auto-merge.yml` then declines to merge that PR and says
      # which major is holding it, so a major is reviewed rather than merged — and still visible.
      # A major that can never be taken belongs in `ignore:` below, which is what that list is for.
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # The engine's asset layout is part of this plugin's contract, so its major versions
      # are reviewed by hand rather than merged automatically.
      - dependency-name: '@plantuml/core'
        update-types: ['version-update:semver-major']

      # Majors that are blocked upstream, not merely unreviewed. Each was tried, each broke
      # something that cannot be fixed from this repository, and leaving them un-ignored means
      # a grouped PR that can never go green — which hides the updates that *are* takeable.
      # Revisit by deleting the entry and letting Dependabot re-propose it.

      # TypeScript 7 removes the TS 6 compiler API that typescript-eslint uses, and it refuses
      # to run: "typescript-eslint does not support TS 7.0". Tracked upstream at
      # typescript-eslint#10940. Blocked until typescript-eslint ships TS >= 7.1 support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

      # ESLint 10 is blocked by eslint-plugin-react, whose latest release (7.37.5) still caps
      # its peer range at `^9.7`. typescript-eslint and eslint-config-prettier are both ready;
      # this is the one plugin holding the upgrade. Blocked until it publishes ESLint 10 support.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

      # jsdom 30 requires Node `^22.22.2 || ^24.15.0 || >=26.0.0`, dropping Node 20 entirely.
      # Taking it would mean this repository could no longer test on Node 20, and the honest
      # consequence of that is raising `engines.node` — which is not ours to raise: `@docusaurus/
      # core` still declares `node: >=20.0` as of 3.10.2, and a plugin whose floor sits above its
      # host's cannot be installed into a site Docusaurus itself supports. Node 20 being EOL is
      # beside the point; the gate is Docusaurus's floor, not Node's support calendar.
      #
      # jsdom is a devDependency, so this costs consumers nothing. jsdom 29 still supports
      # `^20.19.0` and is taken. Revisit when Docusaurus raises its own minimum.
      - dependency-name: 'jsdom'
        versions: ['>=30']

      # eslint-plugin-react-hooks 7 turns on the React Compiler rules. `react-hooks/refs` and
      # `react-hooks/set-state-in-effect` flag 15 places in `useZoomPan`, all of them the
      # deliberate design recorded in docs/adr/0003-zoom-container-transform.md: the transform
      # lives in a ref and is written straight to the DOM so that panning never re-renders.
      # Adopting it would mean redesigning that hook or blanket-disabling the new rules.
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']

  # A different ecosystem, so Dependabot cannot fold it into the npm PR above. Scheduling it a day
  # later keeps the two from overlapping in practice; if they ever do, the `refresh` job in
  # dependabot-auto-merge.yml brings the second one up to date after the first lands.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: tuesday
      time: '04:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
