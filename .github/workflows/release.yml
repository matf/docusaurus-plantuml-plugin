# Cuts a release from `main` whenever CI has gone green there and `CHANGELOG.md` asks for one.
#
# Triggering on CI's completion rather than on the push itself is deliberate: it makes "the tree
# was green" a precondition of releasing rather than something checked afterwards. `publish.yml`
# still re-runs the entire suite on the tagged tree before anything reaches npm.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to derive it from CHANGELOG.md)'
        required: false
        type: string
      dry_run:
        description: 'Decide and print, but push nothing'
        required: false
        default: false
        type: boolean

permissions: {}

# The version bump reads `main`, writes on top of it and pushes. Two of those interleaving is the
# race this whole workflow exists to remove, so they are serialised, never cancelled.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag and hand off to Publish
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The bump commit and the tag are pushed with this token rather than GITHUB_TOKEN, because a
      # GITHUB_TOKEN push triggers no further workflows — the tag would sit there and `publish.yml`
      # would never run.
      - name: Mint an app token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Attribute the release commit to the app
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Decide the version
        if: inputs.dry_run
        env:
          # Through env, never interpolated into the script line: a `${{ }}` expression inside `run:`
          # is substituted before the shell ever sees it.
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${FORCED_VERSION}" ]; then
            node scripts/next-release.mjs --dry-run --version "${FORCED_VERSION}"
          else
            node scripts/next-release.mjs --dry-run
          fi

      - name: Bump, commit and push the tag
        if: ${{ !inputs.dry_run }}
        id: release
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          decision="${RUNNER_TEMP}/next-release.out"

          for attempt in 1 2 3; do
            git fetch --tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            git reset --hard origin/main

            # A release commit is itself a push to main, which runs CI, which triggers this
            # workflow again. Stop the loop here; an empty [Unreleased] would stop it anyway.
            case "$(git log -1 --format=%s)" in
              'Release '*)
                echo 'Head is already a release commit; nothing to do.'
                exit 0
                ;;
            esac

            : >"$decision"
            if [ -n "${FORCED_VERSION}" ]; then
              GITHUB_OUTPUT="$decision" node scripts/next-release.mjs --version "${FORCED_VERSION}"
            else
              GITHUB_OUTPUT="$decision" node scripts/next-release.mjs
            fi

            if [ "$(grep -m1 '^release=' "$decision" | cut -d= -f2-)" != 'true' ]; then
              echo 'release=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            version="$(grep -m1 '^version=' "$decision" | cut -d= -f2-)"

            git add package.json package-lock.json CHANGELOG.md
            git commit --message "Release ${version}"
            git tag --annotate "v${version}" --message "Release ${version}"

            # Atomic: the bump commit and its tag land together or not at all. A tag that survives
            # a rejected push is how a release ends up describing a tree that is not on main.
            if git push --atomic origin HEAD:main "refs/tags/v${version}"; then
              echo "Released v${version} on attempt ${attempt}."
              {
                echo 'release=true'
                echo "version=${version}"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected — main moved. Rebuilding the release from scratch (attempt ${attempt}/3)."
            git tag --delete "v${version}"
          done

          echo 'main kept moving under three attempts; giving up rather than forcing anything.' >&2
          exit 1

      - name: Summarise
        if: always() && !inputs.dry_run
        run: |
          if [ "${{ steps.release.outputs.release }}" = 'true' ]; then
            echo "Released \`v${{ steps.release.outputs.version }}\`. Publish will pick up the tag." >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'No release was warranted from this run.' >>"$GITHUB_STEP_SUMMARY"
          fi
